<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beauty Parlour</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #fff0f5;
      color: #333;
    }
    header {
      background: #ff69b4;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav a {
      margin: 0 15px;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    section {
      padding: 50px 20px;
      text-align: center;
    }
    .services {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 250px;
    }
    .form-box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background: #ff69b4;
      color: white;
      border: none;
      cursor: pointer;
    }
    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .social a {
      margin: 0 10px;
      color: white;
      text-decoration: none;
      font-size: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>Glow Beauty Parlour</h1>
  <nav>
    <a href="#services">Services</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section id="services">
  <h2>Our Services</h2>
  <div class="services">
    <div class="card">Facial Treatment</div>
    <div class="card">Hair Styling</div>
    <div class="card">Makeup</div>
    <div class="card">Manicure</div>
  </div>
</section>

<section id="about">
  <h2>About Us</h2>
  <p>We provide professional beauty services to make you look and feel amazing.</p>
</section>

<section id="contact">
  <h2>Book Appointment</h2>
  <div class="form-box">
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <button type="submit">Submit</button>
    </form>
  </div>
</section>

<footer>
  <p>Follow us</p>
  <div class="social">
    <a href="#">Facebook</a>
    <a href="#">Instagram</a>
    <a href="#">WhatsApp</a>
  </div>
  <p>© 2026 Beauty Parlour</p>
</footer>

</body>
</html>
